# Prepared from the site's configuration supplied on 2026-10-13.
# Before activation: upload login assets, start aurora-telemetry-auth,
# confirm Lua support, back up the current site config, then nginx -t.
server
{
    listen 80;
    listen 443 ssl;
    # This server's Lua capture rejects HTTP/2 requests; use HTTPS over HTTP/1.1.
    # Do not advertise QUIC/HTTP/3 while using this authentication bridge.
    http2 off;
    http3 off;
    server_name telemetry.aurora-racing.com;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/telemetry.aurora-racing.com;
    include /www/server/panel/vhost/nginx/extension/telemetry.aurora-racing.com/*.conf;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/telemetry.aurora-racing.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/telemetry.aurora-racing.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/telemetry.aurora-racing.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc "clear" always;
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/html_telemetry.aurora-racing.com.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        auth_basic off;
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Merge into ONLY the telemetry HTTPS server block. Keep Baota SSL and ACME.
    # Uses the Lua module already present in this Baota Nginx build.
    # Replace the previous root proxy location; do not append a duplicate.

    location = /login {
        auth_basic off;
        alias /srv/i3pro-login/telemetry-login.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc "clear" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The login page uses relative /login-assets/ URLs after packaging.
    # Separate from i3pro's own static resource paths.
    location ^~ /login-assets/ {
        auth_basic off;
        alias /srv/i3pro-login/assets/;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc "clear" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /auth/login {
        auth_basic off;
        client_max_body_size 4k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8732;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_cache off;
    }

    location = /auth/session {
        auth_basic off;
        proxy_pass http://127.0.0.1:8732;
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
    }

    location = /auth/logout {
        auth_basic off;
        proxy_pass http://127.0.0.1:8732;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
    }

    location = /_telemetry_auth {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:8732/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
    }

    location = /_telemetry_entry {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:8732/auth/check-entry;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
    }

    # Replace any existing location /session/ with this ONE block.
    # Remove the old /_telemetry_page location if still present.
    # Keep existing /, /auth/*, /login and /login-assets/ locations unchanged.
    # Requires the auth_service.py shipped in telemetry-share-proxy.zip FIRST.
    # Keep this site's HTTP/2 and HTTP/3 disabled during this incremental rollout.
    location /session/ {
        auth_basic off;
        client_max_body_size 1k;
        # No URI suffix: preserve the original encoded path and query string.
        proxy_pass http://127.0.0.1:8732;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Referer $http_referer;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 310s;
        proxy_send_timeout 15s;
        proxy_buffer_size 32k;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_next_upstream off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc "clear" always;
    }

    # Each root navigation consumes a single entry granted by a fresh password check.
    # Refreshing or reopening the workspace redirects to login; APIs keep their session.
    location = / {
        auth_basic off;
        access_by_lua_block {
            local res = ngx.location.capture("/_telemetry_entry")
            if res and res.status == 204 then
                return
            end
            if res and res.status == 401 then
                return ngx.redirect("/login", ngx.HTTP_MOVED_TEMPORARILY)
            end
            return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
        }
        client_max_body_size 256m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:8731;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc "clear" always;
    }

    # Keep a plain prefix so Baota's existing sensitive-file and ACME regex rules apply.
    location / {
        auth_basic off;
        access_by_lua_block {
            local res = ngx.location.capture("/_telemetry_auth")
            if res and res.status == 204 then
                return
            end
            if res and (res.status == 401 or res.status == 403) then
                return ngx.exit(res.status)
            end
            return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
        }
        client_max_body_size 256m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:8731;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Alt-Svc "clear" always;
    }


    access_log /www/wwwlogs/telemetry.aurora-racing.com.log;
    error_log /www/wwwlogs/telemetry.aurora-racing.com.error.log;
}

