# Merge into ONLY the telemetry HTTPS server block. Keep Baota SSL and ACME.
# Uses the Lua module already present in this Baota Nginx build.
# Replace the previous root proxy location; do not append a duplicate.
# REQUIRED in the enclosing server: replace http2 on with http2 off;
# set http3 off; remove listen 443 quic; retain listen 443 ssl.
# Replace existing Alt-Svc advertisements with: add_header Alt-Svc "clear" always;
# This server's Lua capture fails on HTTP/2. See the complete site config.

location = /login {
    auth_basic off;
    alias /srv/i3pro-login/telemetry-login.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

# The login page uses relative /login-assets/ URLs after packaging.
# Separate from i3pro's own static resource paths.
location ^~ /login-assets/ {
    auth_basic off;
    alias /srv/i3pro-login/assets/;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /auth/login {
    auth_basic off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8732;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_cache off;
}

location = /auth/session {
    auth_basic off;
    proxy_pass http://127.0.0.1:8732;
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
}

location = /auth/logout {
    auth_basic off;
    proxy_pass http://127.0.0.1:8732;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
}

location = /_telemetry_auth {
    internal;
    auth_basic off;
    proxy_pass http://127.0.0.1:8732/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
}

location = /_telemetry_entry {
    internal;
    auth_basic off;
    proxy_pass http://127.0.0.1:8732/auth/check-entry;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
}

# Replace any existing location /session/ with this ONE block.
# Remove the old /_telemetry_page location if still present.
# Keep existing /, /auth/*, /login and /login-assets/ locations unchanged.
# Requires the auth_service.py shipped in telemetry-share-proxy.zip FIRST.
# Keep this site's HTTP/2 and HTTP/3 disabled during this incremental rollout.
location /session/ {
    auth_basic off;
    client_max_body_size 1k;
    # No URI suffix: preserve the original encoded path and query string.
    proxy_pass http://127.0.0.1:8732;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Referer $http_referer;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 310s;
    proxy_send_timeout 15s;
    proxy_buffer_size 32k;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_next_upstream off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc "clear" always;
}

# Each root navigation consumes a single entry granted by a fresh password check.
# Refreshing or reopening the workspace redirects to login; APIs keep their session.
location = / {
    auth_basic off;
    access_by_lua_block {
        local res = ngx.location.capture("/_telemetry_entry")
        if res and res.status == 204 then
            return
        end
        if res and res.status == 401 then
            return ngx.redirect("/login", ngx.HTTP_MOVED_TEMPORARILY)
        end
        return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
    }
    client_max_body_size 256m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:8731;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

# Keep a plain prefix so Baota's existing sensitive-file and ACME regex rules apply.
location / {
    auth_basic off;
    access_by_lua_block {
        local res = ngx.location.capture("/_telemetry_auth")
        if res and res.status == 204 then
            return
        end
        if res and (res.status == 401 or res.status == 403) then
            return ngx.exit(res.status)
        end
        return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
    }
    client_max_body_size 256m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:8731;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
